name: Auto Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-checks-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify release for HappyDucky02
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and test client
        run: python -m pip install ".[web]" httpx
      - name: Test deployment and identity safety
        env:
          PYTHONPATH: src:tests
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest test_autodeploy test_email_auth test_desktop_onboarding -v
      - name: Verify progress, evidence and creator import
        env:
          PYTHONPATH: src:tests
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest test_progress test_progress_delivery test_backlog_evidence test_backlog_import_fidelity test_backlog_upload test_creator_progress test_credential_canary -v
      - name: Explain release handoff
        run: |
          echo "The HappyDucky02 controller polls main and deploys only this exact revision after these checks succeed." >> "$GITHUB_STEP_SUMMARY"
          echo "This job does not touch client data or restart applications. Runtime deployment status is at https://test.lokvetia.com/deployments." >> "$GITHUB_STEP_SUMMARY"
