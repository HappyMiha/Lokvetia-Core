[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-factory-orchestrator"
version = "0.1.0"
description = "Lokvetia Core: provider-neutral AI agent orchestration under human control"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["agents", "orchestration", "workflow", "ai", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["temporalio==1.31.0"]

[project.scripts]
lokvetia = "agent_factory.cli:main"
lokvetia-temporal-worker = "agent_factory.orchestration.temporal.worker:main"
agent-factory = "agent_factory.cli:main"
agent-factory-temporal-worker = "agent_factory.orchestration.temporal.worker:main"

[project.urls]
Homepage = "https://lokvetia.com"
Repository = "https://github.com/HappyMiha/Lokvetia-Core"
Documentation = "https://github.com/HappyMiha/Lokvetia-Core/tree/main/docs"
Issues = "https://github.com/HappyMiha/Lokvetia-Core/issues"
"Game creation with Lokiravia" = "https://github.com/HappyMiha/Lokiravia"

[project.optional-dependencies]
dev = ["build>=1.2", "httpx2>=2.10,<3", "httpx>=0.28,<1"]
web = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1", "pypdf>=5,<7", "python-multipart>=0.0.20,<1"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_factory*"]

[tool.setuptools.package-data]
agent_factory = ["defaults/*.json", "defaults/*.yaml", "static/*"]
